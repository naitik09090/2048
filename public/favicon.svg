<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ee7752;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#e73c7e;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#23a6d5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#23d5ab;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="tileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGradient)"/>
  
  <!-- Tile background -->
  <rect x="15" y="15" width="70" height="70" rx="10" fill="url(#tileGradient)" filter="url(#glow)"/>
  
  <!-- Shadow for depth -->
  <rect x="15" y="15" width="70" height="70" rx="10" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Number 2048 -->
  <text x="50" y="62" font-family="'Poppins', Arial, sans-serif" font-size="24" font-weight="800" fill="#2d3436" text-anchor="middle" filter="url(#glow)">2048</text>
  
  <!-- Subtle shine effect -->
  <rect x="20" y="20" width="30" height="30" rx="5" fill="rgba(255,255,255,0.3)" opacity="0.6"/>
</svg>
